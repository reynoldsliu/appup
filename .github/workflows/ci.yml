name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./appup selftest
      # non-interactive smoke on a clean runner; test_cli.py needs a real Mac
      # with manual .apps + cask catalog, so it stays a local integration test
      - run: ./appup help
      - run: ./appup list --json > /dev/null
      - run: ./appup outdated --json > /dev/null
